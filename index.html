<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>งานทีมห้องสมุด</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: slim user bar, header + team strip, then a ledger of weeks (date-stamp column + task list) */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --ink: #18221d; --muted: #5d6b63; --line: #d9e0db;
  --accent: #1d5c48; --accent-soft: #e2eee8; --wait: #a2620a; --wait-soft: #fbf0dc;
  --done-ink: #7d8a83; --ai: #6a4c9c; --ai-soft: #efe9f7; --danger: #a63a2b; --danger-soft: #fbe7e3;
  --font-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121815; --surface: #1a221e; --ink: #e6ece8; --muted: #9aa9a1; --line: #2c3832;
    --accent: #6cc3a3; --accent-soft: #1d3329; --wait: #e5a54a; --wait-soft: #342812;
    --done-ink: #6f7d76; --ai: #b9a2e6; --ai-soft: #2a2238; --danger: #f08b7a; --danger-soft: #3a1d18;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap {
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 64px; display: flex; flex-direction: column; gap: 22px;
}
.userbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.userbar .me { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.userbar .me b { color: var(--ink); font-weight: 600; }
.rolechip { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.rolechip.viewer { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
header.top { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; }
.eyebrow { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; margin: 2px 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 14px; }
.overall { min-width: 220px; flex: 0 1 300px; display: flex; flex-direction: column; gap: 6px; }
.overall .num { font-family: var(--font-display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.overall .num small { font-size: 15px; color: var(--muted); font-weight: 500; }
.syncrow { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.notice { font-size: 14px; padding: 10px 14px; border-radius: 8px; background: var(--wait-soft); border: 1px solid var(--line); display: flex; gap: 12px; justify-content: space-between; align-items: start; }
[hidden] { display: none !important; }

.team { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.person { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.person:hover { border-color: var(--muted); }
.person:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.person[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.person .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.person b { font-weight: 600; }
.person .role { font-size: 12px; color: var(--muted); }
.person .cnt { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.person .bar { height: 5px; }

.filters { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.group .lbl { font-size: 13px; color: var(--muted); margin-right: 4px; }
.chip { cursor: pointer; font-size: 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; min-height: 32px; font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
:is(.chip, .btn, .linkbtn, .note-toggle):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.week { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
.stamp { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 12px; align-self: start; }
.stamp .wl { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.stamp .wn { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: .95; font-variant-numeric: tabular-nums; }
.stamp .wt { font-size: 13px; color: var(--muted); line-height: 1.35; }
.stamp .wc { font-size: 13px; font-variant-numeric: tabular-nums; }
.stamp.complete .wn { color: var(--accent); }
.tasks { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.routine { font-size: 13px; color: var(--muted); padding: 8px 12px; border: 1px dashed var(--line); border-radius: 8px; }
.routine b { color: var(--ink); font-weight: 600; }
.task { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.task input[type=checkbox] { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); cursor: pointer; }
.task input:disabled { cursor: not-allowed; }
.task .txt { min-width: 0; overflow-wrap: anywhere; }
.task.done .txt { color: var(--done-ink); text-decoration: line-through; text-decoration-color: var(--line); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 4px; font-size: 13px; color: var(--muted); align-items: center; }
.who { font-weight: 600; color: var(--ink); }
.task.done .who { color: var(--done-ink); }
.code { font-family: var(--font-mono); font-size: 12px; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.dep { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--wait-soft); color: var(--wait); }
.dep.ok { background: transparent; color: var(--muted); padding-left: 0; }
.by { color: var(--accent); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
footer { font-size: 13px; color: var(--muted); }

.note-toggle { cursor: pointer; border: 0; background: none; padding: 2px 0; font-size: 13px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.notes { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 8px; }
.note { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.note .nhead { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--muted); }
.note .ntext { white-space: pre-wrap; overflow-wrap: anywhere; }
.note .nimg { margin-top: 6px; }
.note .nimg img { max-width: 100%; max-height: 360px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; transition: opacity .15s; }
.note .nimg img:hover { opacity: .85; }
.imgrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.imgrow .preview { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.imgrow .fname { font-size: 12px; color: var(--muted); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note .ntask { font-size: 12px; color: var(--muted); }
.ntype { font-size: 12px; padding: 1px 8px; border-radius: 99px; font-weight: 500; }
.ntype.problem { background: var(--wait-soft); color: var(--wait); }
.ntype.fix { background: var(--accent-soft); color: var(--accent); }
.ntype.ai { background: var(--ai-soft); color: var(--ai); }
.ntype.other { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.linkbtn { font-size: 12px; border: 0; background: none; color: var(--muted); cursor: pointer; text-decoration: underline; padding: 0; }
.userbar .linkbtn { font-size: 13px; }
.linkbtn.danger { color: var(--danger); }
.hint { font-size: 12px; color: var(--muted); }
.nform { display: flex; flex-direction: column; gap: 6px; }
.nform .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.input, .nform select, .nform textarea { font-size: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
.nform textarea { width: 100%; min-height: 64px; resize: vertical; }
:is(.input, select, textarea):focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { cursor: pointer; font-size: 14px; border-radius: 6px; padding: 6px 14px; min-height: 36px; background: var(--accent); color: var(--surface); border: 1px solid var(--accent); font-weight: 500; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.feed { display: flex; flex-direction: column; gap: 8px; }
.feed .note { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.feedbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.feedbar p { margin: 0; font-size: 14px; color: var(--muted); }
.feedbar .acts { display: flex; flex-wrap: wrap; gap: 8px; }

.res-cat { display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.res-cat h2, .panel h2 { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 0; }
.res { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.res .rtop { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; justify-content: space-between; }
.res .rlabel { font-weight: 600; }
.rval { display: flex; gap: 8px; align-items: center; min-width: 0; }
.rval code { font-family: var(--font-mono); font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; overflow-x: auto; white-space: nowrap; min-width: 0; flex: 1 1 auto; user-select: all; }
.rval .missing { color: var(--wait); font-size: 13px; }
.res .rnote { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.res .rmeta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.res .rmeta a { color: var(--accent); }
.rform { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.rform label, .field { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); min-width: 0; }
.rform .wide { grid-column: 1 / -1; }
.rform .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.err { color: var(--danger); font-size: 13px; }
.warnbox { font-size: 13px; padding: 10px 12px; border-radius: 8px; background: var(--wait-soft); }

/* users admin */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.panel.creds { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; font-size: 13px; color: var(--muted); }
.roles b { color: var(--ink); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 500; background: var(--bg); }
tr:last-child td { border-bottom: 0; }
td.mono, .mono { font-family: var(--font-mono); font-size: 13px; }
td .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; }
.pill.on { background: var(--accent-soft); color: var(--accent); }
.pill.off { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill.wait { background: var(--wait-soft); color: var(--wait); }
.ucreate { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; align-items: end; }

/* auth screens */
.auth { min-height: 100vh; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
.card.wide { max-width: 620px; }
.card h1 { font-size: 26px; margin: 0; }
.card .input { font-size: 15px; padding: 9px 10px; }
.card .btn { min-height: 42px; font-size: 15px; }
.card ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.card code { font-family: var(--font-mono); font-size: 13px; background: var(--bg); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }

#print-area { display: none; }
@media print {
  body.printing #app, body.printing .noprint { display: none !important; }
  body.printing #print-area { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  body { background: #fff; color: #000; }
  .slip { border: 1px dashed #777; padding: 14px 16px; break-inside: avoid; font-size: 13px; line-height: 1.6; color: #000; }
  .slip b { font-size: 15px; }
  .slip .mono { font-size: 15px; }
}

@media (max-width: 640px) {
  .week { grid-template-columns: 1fr; gap: 10px; }
  .stamp { position: static; flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .stamp .wn { font-size: 30px; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>

function thaiStamp(iso) {
  const d = new Date(iso); if (!iso || isNaN(d)) return "";
  const m = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const parts = new Intl.DateTimeFormat("en-GB", {timeZone:"Asia/Bangkok", day:"numeric", month:"numeric", year:"numeric", hour:"2-digit", minute:"2-digit", hour12:false}).formatToParts(d);
  const g = t => (parts.find(p => p.type === t) || {}).value || "";
  return `${g("day")} ${m.at(Number(g("month")) - 1)} ${Number(g("year")) + 543} ${g("hour")}:${g("minute")}`;
}

// ---------- API ----------
function apiErr(code, message, handled) { const e = new Error(message); e.code = code; e.handled = !!handled; return e; }
async function api(action, data) {
  let res;
  try {
    res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, token, data: data || {} }) });
  } catch (e) {
    throw apiErr("E_NETWORK", "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจอินเทอร์เน็ต หรือให้ครูตรวจว่า Web App ตั้งผู้มีสิทธิ์เข้าถึงเป็น \"ทุกคน\"");
  }
  let j;
  try { j = await res.json(); } catch (e) { throw apiErr("E_SERVER", "เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง ให้ครูตรวจ API_URL ใน index.html"); }
  if (!j.ok) {
    if (j.code === "E_NO_TOKEN" || j.code === "E_SESSION_EXPIRED") { clearSession(); showLogin(j.error); throw apiErr(j.code, j.error, true); }
    if (j.code === "E_MUST_CHANGE") { showChange(true); throw apiErr(j.code, j.error, true); }
    throw apiErr(j.code, j.error);
  }
  return j.data;
}

function clearSession() { token = null; me = null; store.del("libteam.token"); usersList = null; creds = []; }

function applyState(st) {
  me = st.me;
  people = Object.fromEntries((st.people || []).map(p => [p.user_id, p]));
  const next = {};
  (st.done || []).forEach(d => { next[d.task_id] = { by: d.user_id, at: d.done_at }; });
  pending.forEach(id => { if (doneMap[id]) next[id] = doneMap[id]; else delete next[id]; });
  doneMap = next;
  notes = st.notes || [];
  resources = st.resources || [];
  lastSync = Date.now();
  syncMsg = "อัปเดตล่าสุด " + thaiStamp(new Date().toISOString()).split(" ").pop() + " น.";
}

async function refresh() {
  if (screen !== "main" || refreshing) return;
  refreshing = true;
  const seq = writeSeq;
  try {
    const st = await api("getState");
    if (seq === writeSeq && screen === "main") { applyState(st); render(); }
  } catch (e) {
    if (!e.handled) { syncMsg = "ดึงข้อมูลไม่สำเร็จ จะลองใหม่อัตโนมัติ"; paintSync(); }
  } finally { refreshing = false; }
}

async function write(action, data) {
  writeSeq++;
  try {
    const st = await api(action, data);
    applyState(st);
  } finally { writeSeq++; }
}

        <button type="button" class="linkbtn" id="btnPw">เปลี่ยนรหัสผ่าน</button>
        <button type="button" class="linkbtn" id="btnOut">ออกจากระบบ</button></span>
    </div>
    <header class="top">
      <div>
        <div class="eyebrow">รายวิชาการพัฒนาระบบร่วมกันด้วยแพลตฟอร์ม</div>
        <h1>งานทีมพัฒนาระบบห้องสมุด</h1>
        <p class="sub">ติ๊กเมื่องานผ่าน “ตรวจว่าเสร็จ” ในใบงานของตัวเอง · รหัส prompt ดูในแผนการเรียนรู้ 10 สัปดาห์</p>
      </div>
      <div class="overall" aria-live="polite">
        <div class="num" id="overallNum"></div>
        <div class="bar"><i id="overallBar" style="width:0%"></i></div>
        <div class="syncrow"><span id="syncState"></span><button type="button" class="linkbtn" id="btnSync">ดึงข้อมูลใหม่</button></div>
      </div>
    </header>
    <div class="notice" id="notice" hidden><span id="noticeText"></span><button type="button" class="linkbtn" id="noticeClose">ปิด</button></div>
    <section aria-label="ความคืบหน้ารายบุคคล"><div class="team" id="team"></div></section>
    <div class="filters">
      <div class="group" id="viewFilter"><span class="lbl">แสดง</span></div>
      <div class="group" id="weekFilter"><span class="lbl">สัปดาห์</span></div>
      <div class="group" id="statusFilter"><span class="lbl">สถานะ</span></div>
    </div>
    <main id="list"></main>
    <footer>ข้อมูลเก็บใน Google Sheets ของวิทยาลัย · ห้ามใส่ข้อมูลนักเรียนจริงหรือรหัสผ่านในบันทึกและข้อมูลกลาง · งานประจำทุกคาบอยู่ในกรอบเส้นประของแต่ละสัปดาห์</footer>
  </div>`;
  $("btnPw").addEventListener("click", () => showChange(false));
  $("btnOut").addEventListener("click", logout);
  $("btnSync").addEventListener("click", () => refresh());
  $("noticeClose").addEventListener("click", () => { $("notice").hidden = true; });
  const views = [["tasks","รายการงาน"],["notes","บันทึกทั้งหมด"],["shared","ข้อมูลกลาง"]];
  if (isAdmin()) views.push(["users","จัดการผู้ใช้"]);
  chipGroup("viewFilter", views, v => { fView = v; store.set("libteam.view", v); if (v === "users") loadUsers(); });
  chipGroup("weekFilter", [["all","ทั้งหมด"], ...Object.keys(WEEKS).map(w => [w, w])], v => { fWeek = v; store.set("libteam.week", v); });
  chipGroup("statusFilter", [["all","ทั้งหมด"],["open","ยังไม่เสร็จ"],["done","เสร็จแล้ว"],["noted","มีบันทึก"]], v => { fStatus = v; store.set("libteam.status", v); });
}

function chipGroup(id, opts, set) {
  const g = $(id);
  opts.forEach(([v, label]) => {
    const b = el("button", "chip", label); b.type = "button"; b.dataset.v = v;
    b.addEventListener("click", () => { set(v); render(); });
    g.appendChild(b);
  });
}

function showNotice(msg) { if (screen !== "main") return; $("noticeText").textContent = msg; $("notice").hidden = false; }
function paintSync() { const s = $("syncState"); if (s) s.textContent = syncMsg; }

// ---------- render ----------
function render() {
  if (screen !== "main") return;
  const ae = document.activeElement;
  const keep = ae && ae.id ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;

  $("meName").textContent = me.display_name;
  const rc = $("meRole"); rc.textContent = ROLE_LABEL[me.role] || me.role; rc.className = "rolechip " + me.role;
  paintSync();

  const total = TASKS.length;
  const doneCount = TASKS.filter(t => doneMap[t.id]).length;
  const num = $("overallNum"); num.textContent = "";
  num.append(String(doneCount), " "); num.appendChild(el("small", null, `/ ${total} งาน`));
  $("overallBar").style.width = (total ? doneCount / total * 100 : 0) + "%";

  const team = $("team"); team.textContent = "";
  PEOPLE.forEach(([key, name, role]) => {
    const mine = TASKS.filter(t => t.who === key);
    const d = mine.filter(t => doneMap[t.id]).length;
    const b = el("button", "person"); b.type = "button";
    b.setAttribute("aria-pressed", String(fWho === key));
    const top = el("div", "top");
    const nm = el("div"); nm.appendChild(el("b", null, name)); nm.appendChild(el("div", "role", role));
    top.appendChild(nm); top.appendChild(el("span", "cnt", `${d}/${mine.length}`));
    const bar = el("div", "bar"); const i = el("i"); i.style.width = (mine.length ? d / mine.length * 100 : 0) + "%"; bar.appendChild(i);
    b.append(top, bar);
    b.setAttribute("aria-label", `${name} เสร็จ ${d} จาก ${mine.length} งาน กดเพื่อกรองเฉพาะงานของ${name}`);
    b.addEventListener("click", () => { fWho = fWho === key ? "all" : key; store.set("libteam.who", fWho); render(); });
    team.appendChild(b);
  });

  document.querySelectorAll("#weekFilter .chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.v === String(fWeek))));
  document.querySelectorAll("#viewFilter .chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.v === fView)));
  document.querySelectorAll("#statusFilter .chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.v === fStatus)));
  $("statusFilter").hidden = fView !== "tasks";
  $("weekFilter").hidden = fView === "shared" || fView === "users";

  const list = $("list"); list.textContent = "";
  if (fView === "notes") renderFeed(list);
  else if (fView === "shared") renderShared(list);
  else if (fView === "users" && isAdmin()) renderUsers(list);
  else renderTasks(list);

  if (keep) {
    const back = document.getElementById(keep.id);
    if (back && back !== document.activeElement) { back.focus(); try { if (keep.s != null) back.setSelectionRange(keep.s, keep.e); } catch (e) {} }
  }
}

// ---------- tasks ----------
function renderTasks(list) {
  if (!canWrite()) list.appendChild(el("div", "warnbox", "บัญชีผู้ชมดูได้อย่างเดียว ติ๊กงานและเขียนบันทึกไม่ได้"));
  const noteCount = {};
  notes.forEach(n => { noteCount[n.task_id] = (noteCount[n.task_id] || 0) + 1; });
  let shown = 0;
  Object.keys(WEEKS).forEach(wk => {
    const w = Number(wk);
    if (fWeek !== "all" && String(fWeek) !== wk) return;
    const weekAll = TASKS.filter(t => t.w === w);
    const items = weekAll.filter(t =>
      (fWho === "all" || t.who === fWho) &&
      (fStatus === "all" || (fStatus === "done" && doneMap[t.id]) || (fStatus === "open" && !doneMap[t.id]) || (fStatus === "noted" && noteCount[t.id])));
    if (!items.length) return;
    shown += items.length;
    const wDone = weekAll.filter(t => doneMap[t.id]).length;
    const sec = el("section", "week"); sec.setAttribute("aria-label", `สัปดาห์ ${w}`);
    const st = el("div", "stamp" + (wDone === weekAll.length ? " complete" : ""));
    st.append(el("span", "wl", "สัปดาห์"), el("span", "wn", String(w).padStart(2, "0")), el("span", "wt", WEEKS[w]), el("span", "wc", `เสร็จ ${wDone}/${weekAll.length}`));
    const box = el("div", "tasks");
    if (w >= 2 && w <= 9 && fWho === "all" && fStatus === "all") { const r = el("div", "routine"); r.innerHTML = ROUTINE; box.appendChild(r); }
    items.forEach(t => box.appendChild(taskRow(t, noteCount[t.id] || 0)));
    sec.append(st, box);
    list.appendChild(sec);
  });
  if (!shown) list.appendChild(el("p", "empty", "ไม่มีงานที่ตรงกับตัวกรองนี้"));
}

function taskRow(t, nCount) {
  const done = !!doneMap[t.id];
  const row = el("div", "task" + (done ? " done" : ""));
  const cb = el("input"); cb.type = "checkbox"; cb.id = "cb-" + t.id; cb.checked = done;
  cb.disabled = !canWrite() || pending.has(t.id);
  cb.addEventListener("change", () => toggle(t.id, cb.checked));
  const body = el("div"); body.style.minWidth = "0";
  const lab = el("label", "txt", t.text); lab.htmlFor = cb.id;
  const meta = el("div", "meta");
  meta.appendChild(el("span", "who", PNAME[t.who]));
  if (t.code) meta.appendChild(el("span", "code", t.code));
  if (!done) t.deps.forEach(d => {
    const dt = TASK[d]; if (!dt) return;
    const ok = !!doneMap[d];
    meta.appendChild(el("span", "dep" + (ok ? " ok" : ""), (ok ? "✓ พร้อมแล้ว: " : "รอ ") + `${PNAME[dt.who]} · ${short(dt.text)}`));
  });
  if (done) {
    const info = doneMap[t.id];
    meta.appendChild(el("span", "by", "✓ เสร็จ" + (info.at ? " " + thaiStamp(info.at) : "") + " · " + personName(info.by)));
  }
  const open = openTasks.has(t.id);
  const tg = el("button", "note-toggle", open ? "ซ่อนบันทึก" : (nCount ? `บันทึก ${nCount} รายการ` : (canWrite() ? "เขียนบันทึก" : "ยังไม่มีบันทึก")));
  tg.type = "button"; tg.id = "tg-" + t.id; tg.setAttribute("aria-expanded", String(open));
  tg.addEventListener("click", () => { if (openTasks.has(t.id)) openTasks.delete(t.id); else openTasks.add(t.id); render(); });
  meta.appendChild(tg);
  body.append(lab, meta);
  if (open) body.appendChild(notesPanel(t));
  row.append(cb, body);
  return row;
}

async function toggle(id, checked) {
  if (!canWrite()) return;
  pending.add(id);
  const prev = doneMap[id];
  if (checked) doneMap[id] = { by: me.user_id, at: new Date().toISOString() }; else delete doneMap[id];
  render();
  try { await write("setDone", { task_id: id, done: checked }); }
  catch (e) { if (prev) doneMap[id] = prev; else delete doneMap[id]; if (!e.handled) showNotice(e.message); }
  finally { pending.delete(id); render(); }
}

// ---------- notes ----------
function noteEl(n, withTask) {
  const box = el("div", "note");
  const head = el("div", "nhead");
  head.appendChild(el("span", "ntype " + (NTYPE[n.type] ? n.type : "other"), NTYPE[n.type] || "อื่นๆ"));
  head.appendChild(el("span", null, personName(n.user_id)));
  head.appendChild(el("span", null, thaiStamp(n.created_at)));
  if (canWrite() && (n.user_id === me.user_id || isAdmin())) {
    const key = "delnote-" + n.note_id;
    const del = el("button", "linkbtn danger", uconfirm[key] ? "กดอีกครั้งเพื่อยืนยันการลบ" : "ลบ"); del.type = "button"; del.id = key;
    del.addEventListener("click", () => { if (uconfirm[key]) { delete uconfirm[key]; removeNote(n.note_id); } else { uconfirm[key] = true; render(); } });
    head.appendChild(del);
  }
  box.appendChild(head);
  box.appendChild(el("div", "ntext", n.text));
  if (n.image_url) {
    const imgWrap = el("div", "nimg");
    const img = el("img"); img.src = n.image_url; img.alt = "รูปแนบ"; img.loading = "lazy";
    img.addEventListener("click", () => window.open(n.image_url, "_blank"));
    img.addEventListener("error", () => { imgWrap.textContent = ""; imgWrap.appendChild(el("span", "hint", "โหลดรูปไม่ได้")); });
    imgWrap.appendChild(img); box.appendChild(imgWrap);
  }
  if (withTask && TASK[n.task_id]) { const t = TASK[n.task_id]; box.appendChild(el("div", "ntask", `งาน: ${t.text} · สัปดาห์ ${t.w} · ${PNAME[t.who]}`)); }
  return box;
}

function notesPanel(t) {
  const p = el("div", "notes");
  const ns = notes.filter(n => n.task_id === t.id).sort((a, b) => (a.created_at > b.created_at ? 1 : -1));
  if (!ns.length) p.appendChild(el("div", "hint", "ยังไม่มีบันทึกของงานนี้"));
  ns.forEach(n => p.appendChild(noteEl(n, false)));
  if (!canWrite()) return p;
  const d = drafts[t.id] || (drafts[t.id] = { text: "", type: "problem", image_url: "", image_name: "", sending: false, uploading: false });
  const f = el("form", "nform");
  const sel = el("select"); sel.id = "nt-" + t.id; sel.setAttribute("aria-label", "ประเภทบันทึก");
  NTYPES.forEach(([v, l]) => { const o = el("option", null, l); o.value = v; if (v === d.type) o.selected = true; sel.appendChild(o); });
  sel.addEventListener("change", () => { d.type = sel.value; });
  const ta = el("textarea"); ta.id = "nx-" + t.id; ta.maxLength = MAX_LEN; ta.value = d.text;
  ta.placeholder = "เช่น AI ตั้งชื่อฟังก์ชันไม่ตรงกับข้อตกลงกลาง แก้โดยวางตาราง action ลงใน prompt อีกครั้ง";
  ta.setAttribute("aria-label", "ข้อความบันทึก");
  const btn = el("button", "btn", d.sending ? "กำลังบันทึก…" : "บันทึก"); btn.type = "submit"; btn.disabled = d.sending || !d.text.trim();
  ta.addEventListener("input", () => { d.text = ta.value; btn.disabled = d.sending || !ta.value.trim(); });

  // --- image attachment ---
  const imgRow = el("div", "imgrow");
  const fileIn = el("input"); fileIn.type = "file"; fileIn.accept = "image/*"; fileIn.id = "fi-" + t.id; fileIn.style.display = "none";
  const pickBtn = el("button", "btn ghost", d.uploading ? "กำลังอัปโหลด…" : "📷 แนบรูป"); pickBtn.type = "button"; pickBtn.disabled = d.uploading;
  pickBtn.addEventListener("click", () => fileIn.click());
  const urlBtn = el("button", "btn ghost", "🔗 วาง URL รูป"); urlBtn.type = "button";
  urlBtn.addEventListener("click", () => {
    const url = prompt("วาง URL รูปภาพ (เช่น https://... .jpg .png)");
    if (url && /^https?:\/\/.+/i.test(url)) { d.image_url = url.trim(); d.image_name = "URL"; render(); }
    else if (url) { showNotice("URL ไม่ถูกต้อง ต้องขึ้นต้นด้วย http:// หรือ https://"); }
  });
  imgRow.append(pickBtn, urlBtn);
  if (d.image_url) {
    const prev = el("img", "preview"); prev.src = d.image_url;
    const fname = el("span", "fname", d.image_name || "รูปแนบ");
    const rm = el("button", "linkbtn danger", "ลบรูป"); rm.type = "button";
    rm.addEventListener("click", () => { d.image_url = ""; d.image_name = ""; render(); });
    imgRow.append(prev, fname, rm);
  }
  fileIn.addEventListener("change", () => { if (fileIn.files[0]) uploadNoteImage(t.id, fileIn.files[0]); });
  imgRow.appendChild(fileIn);

  const row = el("div", "row"); row.append(sel, btn);
  f.append(ta, imgRow, row, el("div", "hint", "ห้ามใส่ข้อมูลนักเรียนจริง เช่น ชื่อ รหัส เบอร์โทร · รูปภาพขนาดไม่เกิน 5 MB"));
  f.addEventListener("submit", e => { e.preventDefault(); addNote(t.id); });
  p.appendChild(f);
  return p;
}

async function addNote(taskId) {
  const d = drafts[taskId]; if (!d || !d.text.trim() || d.sending) return;
  d.sending = true; render();
  try {
    await write("addNote", { task_id: taskId, type: d.type, text: d.text.trim(), image_url: d.image_url || "" });
    d.text = ""; d.image_url = ""; d.image_name = "";
  }
  catch (e) { if (!e.handled) showNotice(e.message); }
  finally { d.sending = false; render(); }
}

async function uploadNoteImage(taskId, file) {
  const d = drafts[taskId]; if (!d) return;
  if (file.size > 5 * 1024 * 1024) { showNotice("ไฟล์ใหญ่เกิน 5 MB"); return; }
  if (!file.type.startsWith("image/")) { showNotice("ไฟล์นี้ไม่ใช่รูปภาพ"); return; }
  d.uploading = true; render();
  try {
    const base64 = await new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ng; r.readAsDataURL(file); });
    d.image_url = base64; d.image_name = file.name;
  } catch (e) { showNotice("อ่านไฟล์ไม่สำเร็จ"); }
  finally { d.uploading = false; render(); }
}

async function removeNote(noteId) {
  try { await write("deleteNote", { note_id: noteId }); } catch (e) { if (!e.handled) showNotice(e.message); }
  render();
}

function renderFeed(list) {
  const ns = notes.filter(n => TASK[n.task_id] && (fWeek === "all" || String(TASK[n.task_id].w) === String(fWeek)) && (fWho === "all" || TASK[n.task_id].who === fWho))
    .sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
  const bar = el("div", "feedbar");
  const counts = NTYPES.map(([v, l]) => `${l} ${ns.filter(n => (NTYPE[n.type] ? n.type : "other") === v).length}`).join(" · ");
  bar.appendChild(el("p", null, `${ns.length} บันทึก · ${counts}`));
  if (ns.length) {
    const ex = el("button", "btn ghost", "ดาวน์โหลด CSV"); ex.type = "button";
    ex.addEventListener("click", () => exportCsv(ns));
    bar.appendChild(ex);
  }
  list.appendChild(bar);
  const feed = el("div", "feed");
  if (!ns.length) feed.appendChild(el("p", "empty", "ยังไม่มีบันทึกในตัวกรองนี้ เปิดงานใดก็ได้แล้วกด \"เขียนบันทึก\""));
  ns.forEach(n => feed.appendChild(noteEl(n, true)));
  list.appendChild(feed);
}

function downloadText(filename, text, mime) {
  const blob = new Blob([text], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function exportCsv(ns) {
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const rows = [["สัปดาห์","งาน","เจ้าของงาน","ผู้เขียน","ประเภท","ข้อความ","เวลา"].map(q).join(",")];
  ns.forEach(n => { const t = TASK[n.task_id]; rows.push([t.w, t.text, PNAME[t.who], (people[n.user_id] && people[n.user_id].display_name) || "สมาชิกทีม", NTYPE[n.type] || "อื่นๆ", n.text, thaiStamp(n.created_at)].map(q).join(",")); });
  downloadText("บันทึกทีมห้องสมุด.csv", "﻿" + rows.join("\r\n"), "text/csv;charset=utf-8");
}

// ---------- shared info ----------
function renderShared(list) {
  list.appendChild(el("div", "warnbox", "เก็บได้เฉพาะข้อมูลที่ไม่ใช่ความลับ เช่น URL, ID ของ Sheet/โฟลเดอร์ และค่าตั้งของทีม ห้ามเก็บรหัสผ่าน token หรือคีย์ลับ เพราะทุกคนในทีมอ่านได้ ค่าลับให้เก็บใน Script Properties ของ GAS"));
  const bar = el("div", "feedbar"); bar.style.marginTop = "12px";
  bar.appendChild(el("p", null, `${resources.length} รายการ · ยังไม่ได้กรอก ${resources.filter(r => !r.value).length}`));
  if (canWrite()) {
    const add = el("button", "btn", "เพิ่มรายการ"); add.type = "button";
    add.addEventListener("click", () => { editing = { res_id: "", cat: "อื่นๆ", label: "", value: "", note: "", owner: "", err: "" }; render(); setTimeout(() => { const f = $("rf-label"); if (f) f.focus(); }, 0); });
    bar.appendChild(add);
  }
  list.appendChild(bar);
  if (editing && !editing.res_id) list.appendChild(resForm());
  const cats = [...CATS, ...new Set(resources.map(r => r.cat).filter(c => !CATS.includes(c)))];
  let any = false;
  cats.forEach(cat => {
    const items = resources.filter(r => (r.cat || "อื่นๆ") === cat && (fWho === "all" || r.owner === fWho))
      .sort((a, b) => (a.sort_order - b.sort_order) || a.label.localeCompare(b.label, "th"));
    if (!items.length) return;
    any = true;
    const sec = el("section", "res-cat");
    sec.appendChild(el("h2", null, cat));
    items.forEach(r => sec.appendChild(editing && editing.res_id === r.res_id ? resForm() : resItem(r)));
    list.appendChild(sec);
  });
  if (!any && !(editing && !editing.res_id)) list.appendChild(el("p", "empty", fWho === "all" ? "ยังไม่มีข้อมูลกลาง" : "คนนี้ยังไม่มีรายการที่ต้องดูแล"));
}

function resItem(r) {
  const box = el("div", "res");
  const top = el("div", "rtop");
  top.appendChild(el("span", "rlabel", r.label));
  if (r.owner && PNAME[r.owner]) top.appendChild(el("span", "who", "ผู้ดูแล: " + PNAME[r.owner]));
  box.appendChild(top);
  const val = el("div", "rval");
  if (r.value) {
    const c = el("code", null, r.value); c.tabIndex = 0; val.appendChild(c);
    const cp = el("button", "btn ghost", "คัดลอก"); cp.type = "button";
    cp.addEventListener("click", () => copyText(r.value, c, cp));
    val.appendChild(cp);
  } else val.appendChild(el("span", "missing", "ยังไม่ได้กรอก"));
  box.appendChild(val);

async function saveResource() {
  const e = editing; if (!e || e.saving) return;
  if (!e.label.trim()) { e.err = "กรุณาใส่ชื่อรายการ"; render(); return; }
  if (SECRET_WORDS.test(e.label + " " + e.note) || SECRET_KEYS.test(e.value)) { e.err = "รายการนี้ดูเหมือนรหัสผ่านหรือคีย์ลับ ห้ามเก็บในระบบนี้"; render(); return; }
  e.saving = true; e.err = ""; render();
  try {
    await write("saveResource", { res_id: e.res_id, cat: e.cat, label: e.label, value: e.value, note: e.note, owner: e.owner });
    editing = null;
  } catch (err) { e.err = err.message; }
  finally { e.saving = false; render(); }
}

async function deleteResource(id) {
  try { await write("deleteResource", { res_id: id }); editing = null; }
  catch (err) { if (editing) editing.err = err.message; }
  render();
}

async function copyText(text, node, btn) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "คัดลอกแล้ว"; }
  catch (e) {
    if (node) { const r = document.createRange(); r.selectNodeContents(node); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
    btn.textContent = "กด Ctrl+C เพื่อคัดลอก";
  }
  setTimeout(() => { btn.textContent = btn.dataset.label || "คัดลอก"; }, 1800);
}

function printSlips() {
  const area = $("print-area"); area.textContent = "";
  const url = location.origin + location.pathname;
  creds.forEach(c => {
    const s = el("div", "slip");
    s.appendChild(el("div", null, "ระบบติดตามงานทีมห้องสมุด · วิทยาลัยการอาชีพแม่สะเรียง"));
    s.appendChild(el("b", null, c.display_name));
    const l1 = el("div", null, "ชื่อผู้ใช้: "); l1.appendChild(el("span", "mono", c.username)); s.appendChild(l1);
    const l2 = el("div", null, "รหัสผ่านชั่วคราว: "); l2.appendChild(el("span", "mono", c.temp_password)); s.appendChild(l2);
    s.appendChild(el("div", null, "เข้าใช้ที่: " + url));
    s.appendChild(el("div", null, "ระบบจะให้ตั้งรหัสผ่านใหม่เมื่อเข้าใช้ครั้งแรก อย่าบอกรหัสผ่านกับผู้อื่น"));
    area.appendChild(s);
  });
  document.body.classList.add("printing");
  const done = () => { document.body.classList.remove("printing"); window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  window.print();
  setTimeout(done, 1500);
}

async function createUser() {
  const e = ucreate; if (!e || busy) return;
  const username = e.username.trim().toLowerCase();
  if (!/^[a-z0-9][a-z0-9_.-]{1,31}$/.test(username)) { e.err = "ชื่อผู้ใช้ใช้ได้เฉพาะ a-z 0-9 _ . - ยาว 2–32 ตัว"; render(); return; }
  if (!e.display_name.trim()) { e.err = "กรุณาใส่ชื่อที่แสดง"; render(); return; }
  busy = true; e.err = ""; render();
  try {
    const r = await api("createUser", { username, display_name: e.display_name.trim(), person_key: e.person_key, role: e.role });
    usersList = r.users; creds = creds.concat(r.created); ucreate = null;
    await refresh();
  } catch (err) { if (!err.handled) e.err = err.message; }
  finally { busy = false; render(); }
}

async function createTeam() {
  if (busy) return;
  busy = true; render();
  try {
    const r = await api("createTeamAccounts");
    usersList = r.users; creds = creds.concat(r.created);
    showNotice(r.created.length ? `สร้างบัญชีใหม่ ${r.created.length} บัญชี` : "ทุกคนในทีมมีบัญชีแล้ว");
    await refresh();
  } catch (err) { if (!err.handled) showNotice(err.message); }
  finally { busy = false; render(); }
}

async function resetPw(u) {
  if (busy) return;
  busy = true; render();
  try { const r = await api("resetPassword", { user_id: u.user_id }); usersList = r.users; creds = creds.concat(r.created); }
  catch (err) { if (!err.handled) showNotice(err.message); }
  finally { busy = false; render(); }
}

async function updateUser(data, fromEdit) {
  if (busy) return;
  busy = true; render();
  try {
    const r = await api("updateUser", data); usersList = r.users;
    if (fromEdit) uedit = null;
    await refresh();
  } catch (err) {
    if (!err.handled) { if (fromEdit && uedit) uedit.err = err.message; else showNotice(err.message); }
  } finally { busy = false; render(); }
}

setInterval(() => { if (document.visibilityState === "visible") refresh(); }, POLL_MS);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - lastSync > 10000) refresh(); });

(async function boot() {
  if (!API_URL) { showConfig(); return; }
  if (!token) { showLogin(""); return; }
  try {
    me = await api("me");
    if (me.must_change_password) showChange(true); else await enterMain();
  } catch (e) {
    if (!e.handled) showLogin(e.code === "E_NETWORK" ? e.message : "");
  }
})();
